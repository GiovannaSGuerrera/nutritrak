name: Production readiness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutritrack_ci_test
          POSTGRES_USER: synthetic_ci
          POSTGRES_PASSWORD: synthetic_ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synthetic_ci -d nutritrack_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://synthetic_ci:synthetic_ci_only_password@127.0.0.1:5432/nutritrack_ci_test
      TEST_DATABASE_CONFIRM: disposable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level=moderate
